apiVersion: apps/v1
kind: Deployment
metadata:
  name: agromart-frontend
  namespace: agromart
  labels:
    app: agromart-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agromart-frontend
  template:
    metadata:
      labels:
        app: agromart-frontend
    spec:
      containers:
        - name: frontend
          image: 848647692924.dkr.ecr.us-east-1.amazonaws.com/agromart-frontend:98dc37c44b37256fe3577b1de19a034c1508976a
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_GRAPHQL_URL
              value: "http://agromart-backend:4000/graphql"
          envFrom:
            - secretRef:
                name: agromart-frontend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: agromart-frontend
  namespace: agromart
  labels:
    app: agromart-frontend
spec:
  type: ClusterIP
  selector:
    app: agromart-frontend
  ports:
    - port: 80
      targetPort: 3000
      name: http