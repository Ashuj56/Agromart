apiVersion: apps/v1
kind: Deployment
metadata:
  name: agromart-backend
  namespace: agromart
  labels:
    app: agromart-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agromart-backend
  template:
    metadata:
      labels:
        app: agromart-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: backend
          # Replace with your ECR URI in CI/CD, e.g. <account_id>.dkr.ecr.ap-south-1.amazonaws.com/agromart-backend:v1.0.0
          image: agromart-backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
          envFrom:
            - secretRef:
                name: agromart-backend-secrets
                optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: agromart-backend
  namespace: agromart
  labels:
    app: agromart-backend
spec:
  type: ClusterIP
  selector:
    app: agromart-backend
  ports:
    - port: 4000
      targetPort: 4000
      name: http